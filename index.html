<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-E Robo | 專業量化投資守門員</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --accent-green: #10b981;
            --text-main: #1e293b;
            --text-light: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 導覽列 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav .logo {
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* 容器佈局 */
        .container {
            max-width: 1000px;
            width: 90%;
            margin-top: 80px;
            margin-bottom: 100px;
        }

        /* 投影片卡片樣式 */
        .slide-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 50px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }

        .slide-card:hover {
            transform: translateY(-5px);
        }

        .slide-card img {
            width: 100%;
            display: block;
            height: auto;
        }

        /* 底部資訊 */
        footer {
            width: 100%;
            padding: 50px 0;
            background: #070b14;
            color: white;
            text-align: center;
            font-size: 0.9rem;
        }

        footer p {
            color: var(--text-light);
            margin-top: 10px;
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            .container {
                width: 95%;
            }
            .slide-card {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Smart-E Robo Presentation</div>
    </nav>

    <div class="container">
        
        <!-- Slide 1: Hero -->
        <div class="slide-card">
            <img src="slide1.png" alt="Smart-E Robo Title Page">
        </div>

        <!-- Slide 2: Pain Points -->
        <div class="slide-card">
            <img src="slide2.png" alt="被忽視的隱形成本與風險">
        </div>

        <!-- Slide 3: Math Solution -->
        <div class="slide-card">
            <img src="slide3.png" alt="從數學根源阻絕劣質標的">
        </div>

        <!-- Slide 4: Scanner UI -->
        <div class="slide-card">
            <img src="slide4.png" alt="Smart-E 診斷掃描器">
        </div>

        <!-- Slide 5: Optimization UI -->
        <div class="slide-card">
            <img src="slide5.png" alt="最佳化權重配置">
        </div>

        <!-- Slide 6: Value Proposition -->
        <div class="slide-card">
            <img src="slide6.png" alt="Smart-E Robo 的價值">
        </div>

        <!-- Slide 7: Pricing -->
        <div class="slide-card">
            <img src="slide7.png" alt="付費方案">
        </div>

        <!-- Slide 8: Team -->
        <div class="slide-card">
            <img src="slide8.png" alt="NTHU 頂尖量化團隊">
        </div>

        <!-- Slide 9: Closing -->
        <div class="slide-card">
            <img src="slide9.png" alt="你專屬的 ETF 守門員">
        </div>

    </div>

    <footer>
        <div>© 2024 Smart-E Robo Team | NTHU QF</div>
        <p>Professional Logic, Simple Action.</p>
    </footer>

</body>
</html>
